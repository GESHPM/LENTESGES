@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
.ra-root{
  --bg:#EEEAE1; --paper:#FBFAF6; --ink:#1B2A2C; --muted:#5E6B66;
  --line:#D8D1C4; --petrol:#13525A; --petrol-d:#0D3B41; --petrol-l:#E4EEEC;
  --green:#2E7A4F; --green-l:#E5F1EA; --amber:#9A6B12; --amber-l:#F6EDDA;
  --red:#A93B36; --red-l:#F5E4E2;
  font-family:'Public Sans',-apple-system,sans-serif; color:var(--ink);
  background:var(--bg); min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.ra-root *{font-family:inherit}
.serif{font-family:'Fraunces',Georgia,serif}
.ra-wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
.ra-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;background:var(--petrol-d);border-radius:14px;margin-bottom:22px;color:#EAF2F0}
.ra-brand{display:flex;align-items:center;gap:11px;font-weight:600}
.ra-brand .logo{width:34px;height:34px;border-radius:9px;background:#EAF2F0;color:var(--petrol-d);
  display:flex;align-items:center;justify-content:center}
.ra-brand small{display:block;font-weight:400;font-size:11.5px;letter-spacing:.04em;opacity:.8;text-transform:uppercase}
.ra-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.14);padding:6px 11px;border-radius:999px}
.ra-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;
  font-weight:600;font-size:14px;border-radius:10px;padding:11px 17px;transition:.15s;font-family:inherit}
.ra-btn:active{transform:translateY(1px)} .ra-btn:disabled{opacity:.5;cursor:not-allowed}
.ra-btn-primary{background:var(--petrol);color:#fff} .ra-btn-primary:hover{background:var(--petrol-d)}
.ra-btn-ghost{background:transparent;color:#EAF2F0;border:1px solid rgba(255,255,255,.3)}
.ra-btn-ghost:hover{background:rgba(255,255,255,.1)}
.ra-btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.ra-btn-green{background:var(--green);color:#fff}.ra-btn-green:hover{filter:brightness(.94)}
.ra-btn-red{background:#fff;color:var(--red);border:1px solid var(--red)}.ra-btn-red:hover{background:var(--red-l)}
.ra-btn-out{background:#fff;color:var(--petrol);border:1px solid var(--line)}.ra-btn-out:hover{border-color:var(--petrol)}
.ra-card{background:var(--paper);border:1px solid var(--line);border-radius:16px}
.ra-card-pad{padding:22px}
.ra-h{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--petrol);
  margin:0 0 14px;display:flex;align-items:center;gap:8px}
.ra-grid{display:grid;gap:14px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:10px 12px;font-size:14.5px;color:var(--ink);outline:none;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-l)}
.fld .mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.fld .err{border-color:var(--red);box-shadow:0 0 0 3px var(--red-l)}
.fld .ok{border-color:var(--green)}
.hint{font-size:12px;margin-top:5px;display:flex;align-items:center;gap:5px}
.hint.bad{color:var(--red)}.hint.good{color:var(--green)}
.locked{background:var(--petrol-l);border:1px dashed var(--petrol);border-radius:9px;padding:10px 13px;
  display:flex;align-items:center;gap:9px;font-weight:600;color:var(--petrol-d);flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.dxchip{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.dxchip.on{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:9px 16px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--petrol);color:#fff}
.tabs{display:inline-flex;gap:4px;background:var(--paper);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:18px}
.tab{display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;cursor:pointer;
  font-weight:600;font-size:14px;padding:9px 16px;border-radius:9px;color:var(--muted)}
.tab.on{background:var(--petrol);color:#fff}
.tab .cnt{font-size:12px;background:rgba(0,0,0,.12);padding:1px 7px;border-radius:999px}
.tab.on .cnt{background:rgba(255,255,255,.22)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--green);color:#fff;
  padding:13px 20px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.18);
  display:flex;align-items:center;gap:9px;z-index:50;animation:pop .3s ease}
@keyframes pop{from{opacity:0}to{opacity:1}}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.b-pend{background:var(--amber-l);color:var(--amber)}
.b-apr{background:var(--green-l);color:var(--green)}
.b-rec{background:var(--red-l);color:var(--red)}
.stat{flex:1;min-width:120px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:15px 17px}
.stat .n{font-size:27px;font-weight:700;line-height:1;font-family:'Fraunces',serif}
.stat .l{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.drawer{position:fixed;inset:0;background:rgba(20,30,30,.4);z-index:40;display:flex;justify-content:flex-end}
.drawer-panel{width:min(480px,100%);background:var(--bg);height:100%;overflow:auto;padding:24px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(440px,100%);background:var(--paper);border:1px solid var(--line);border-radius:20px;
  padding:34px;box-shadow:0 18px 50px rgba(13,59,65,.10)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv b{font-weight:600}
.muted{color:var(--muted)}
.empty{padding:50px;text-align:center;color:var(--muted)}
